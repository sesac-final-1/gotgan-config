# 클러스터 부트스트랩 — cluster/ apply 직후 (infra-schedule 이 호출) 또는 수동. 담당 구지훈 · 10/13 결정 3
# 순서: kubeconfig → namespace · configmap · networkpolicy(DB 티어) → secrets-sync → db(MySQL · Redis, db 노드) → keycloak(realm ConfigMap) → observability → ArgoCD → application.yaml → gateway NLB 주소 · API HTTPS 확인
# 매일 07:00 빈 DB 에서 시작 — 데이터는 Flyway 시드(R__demo_seed.sql) · Keycloak 은 realm import + 시드 스크립트(이경석) 로 복원
name: bootstrap
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ARGOCD_ADMIN_PASSWORD: { required: false }   # ArgoCD admin 비밀번호 고정 — 없으면 초기 랜덤 비밀번호 그대로

permissions:
  id-token: write
  contents: read

concurrency:
  group: bootstrap   # infra-schedule 과 다른 그룹 (workflow_call 교착 방지)
  cancel-in-progress: false

jobs:
  secrets:
    uses: ./.github/workflows/secrets-sync.yml
    secrets: inherit

  bootstrap:
    needs: secrets
    runs-on: ubuntu-latest
    env:
      NS: sesac-gojigi
      ARGOCD_VERSION: v3.5.3
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      # ── 1. namespace · configmap (secrets-sync 는 위 job 에서 이미 끝남 — namespace 는 그쪽에서도 보장한다)
      - name: namespace · app-config · networkpolicy
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-configmap.yaml
          kubectl apply -f deploy/k8s/02-networkpolicy.yaml   # DB 티어: 3306 · 6379 는 tier=backend 파드만, DB 파드 egress 는 DNS 뿐

      # ── 2. DB (StorageClass → MySQL + init-schemas.sh ConfigMap → Redis) — db 노드 그룹(tier=db) 에 뜬다
      - name: db
        run: |
          kubectl apply -f deploy/k8s/db/storageclass.yaml
          kubectl create configmap mysql-init -n "$NS" --from-file=deploy/k8s/db/init-schemas.sh --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/db/mysql.yaml
          kubectl apply -f deploy/k8s/db/redis.yaml
          kubectl rollout status statefulset/mysql -n "$NS" --timeout=300s
          kubectl rollout status statefulset/redis -n "$NS" --timeout=120s

      # ── 3. Keycloak (realm JSON 은 ConfigMap, ${GOTGAN_BACKEND_CLIENT_SECRET} 은 keycloak-secret 환경 변수로 치환)
      - name: keycloak
        run: |
          kubectl create configmap keycloak-realm -n "$NS" --from-file=deploy/k8s/keycloak/realm-gotgan.json --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/keycloak/keycloak.yaml
          kubectl rollout status deployment/keycloak -n "$NS" --timeout=600s

      # ── 3-1. Keycloak 시연 계정 — 관리자 1 · 판매자 2 · 구매자 3 (매일 빈 keycloakdb 라 매일 생성, 멱등)
      #         파드 안 kcadm.sh 로 실행 — 비밀번호(SEED_*)는 keycloak-secret 환경 변수에서 읽어 로그 · 명령 인자에 남지 않는다
      - name: keycloak 시드 계정
        run: kubectl exec -i -n "$NS" deploy/keycloak -- bash -s < scripts/keycloak-seed.sh

      # ── 4. 관측성 (monitoring namespace · Prometheus · Loki · Grafana · Zipkin · kube-state-metrics — blackbox exporter 없음)
      - name: observability
        run: |
          kubectl apply -f deploy/observability/00-namespace.yaml
          # 대시보드 JSON → ConfigMap (README.md 도 같이 들어가지만 Grafana 는 .json 만 읽음). Grafana 보다 먼저 · --server-side 는 last-applied 어노테이션 256KB 제한을 피하려고
          kubectl create configmap grafana-dashboards -n monitoring --from-file=deploy/observability/dashboards/ --dry-run=client -o yaml | kubectl apply --server-side -f -
          kubectl apply -f deploy/observability/   # 하위 폴더(dashboards · alerting)는 읽지 않음 — 대시보드는 위 줄이 ConfigMap 으로 올림

      # ── 5. ArgoCD 설치 + Application (ArgoCD 가 deploy/helm 을 보고 서비스 9개 배포)
      - name: argocd
        run: |
          kubectl get ns argocd >/dev/null 2>&1 || kubectl create ns argocd
          kubectl apply -n argocd --server-side --force-conflicts -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
          kubectl apply -f deploy/argocd/application.yaml

      # ── 5-1. ArgoCD admin 비밀번호 고정 — 매일 재설치돼도 같은 비밀번호 (GitHub Secret ARGOCD_ADMIN_PASSWORD, 공식 "선언적 admin 비밀번호" 방식)
      #        argocd-secret 의 admin.password 에 bcrypt 해시를 넣고, 초기 랜덤 비밀번호 시크릿은 지운다. 시크릿이 없으면 건너뜀(초기 비밀번호 유지)
      - name: argocd admin 비밀번호
        env:
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ARGOCD_ADMIN_PASSWORD" ]; then
            echo "::warning::ARGOCD_ADMIN_PASSWORD 없음 — 초기 비밀번호(argocd-initial-admin-secret) 유지"
            exit 0
          fi
          command -v htpasswd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils >/dev/null; }
          HASH=$(htpasswd -nbBC 10 "" "$ARGOCD_ADMIN_PASSWORD" | tr -d ':\n' | sed 's/^\$2y/$2a/')
          kubectl -n argocd patch secret argocd-secret --type merge \
            -p "{\"stringData\": {\"admin.password\": \"$HASH\", \"admin.passwordMtime\": \"$(date -u +%FT%TZ)\"}}"
          kubectl -n argocd delete secret argocd-initial-admin-secret --ignore-not-found

      # ── 6. gateway NLB 주소 — EIP 2개가 NLB 어노테이션으로 붙는다 (app/eip.tf, 상시 자원) → api.gotgan.click 은 평소 변경 없음
      - name: gateway LoadBalancer 대기
        id: lb
        run: |
          for i in $(seq 1 60); do
            host=$(kubectl get svc -n "$NS" -l app=gateway-service -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$host" ]; then
              echo "gateway NLB: $host"
              echo "hostname=$host" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::gateway LoadBalancer 주소를 10분 안에 받지 못함 — ArgoCD 동기화 · LBC 로그 확인"

      # ── 7. API 공개 주소 확인 — api.gotgan.click(Route 53 A → EIP 2개, app/dns.tf) · NLB 443 TLS(ACM). 상시 자원이라 DNS 변경 없음, 접속만 확인
      - name: API HTTPS 확인
        if: steps.lb.outputs.hostname != ''
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.gotgan.click/actuator/health || true)
            if [ "$code" = "200" ]; then echo "https://api.gotgan.click → 200"; exit 0; fi
            sleep 10
          done
          echo "::warning::https://api.gotgan.click health 가 5분 안에 200 이 아님 (마지막 $code) — NLB 443 리스너 · 인증서 어노테이션 · gateway 파드 확인"
