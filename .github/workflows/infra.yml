# Terraform fmt · validate · plan — PR 검증 전용 (apply 없음 — apply/destroy 는 infra-schedule.yml 또는 구지훈, 컨벤션 5-2). 담당 구지훈
# 폴더마다 상태 파일이 따로라 matrix 로 폴더별 plan. plan 은 OIDC 역할(AWS_ROLE_ARN) 로 S3 backend 를 읽는다
name: infra
on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  id-token: write      # OIDC
  contents: read
  pull-requests: write # plan 결과 코멘트

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'   # provider.tf required_version "~> 1.16.0" · 로컬과 같은 버전
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra/terraform

  plan:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [vpc, ecr, cicd, app, cluster]   # apply 순서. global/s3 는 로컬 상태라 CI 에서 plan 하면 늘 "버킷 새로 생성" 으로 나와 제외
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
      - name: terraform init
        run: terraform init -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -lock=false -out=tfplan
        continue-on-error: true
      - name: plan 결과를 PR 코멘트로
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          FOLDER: ${{ matrix.folder }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(-60000);
            const body = `#### terraform plan \`${process.env.FOLDER}\` — ${process.env.OUTCOME}\n<details><summary>plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: plan 실패면 잡 실패
        if: steps.plan.outcome == 'failure'
        run: exit 1
