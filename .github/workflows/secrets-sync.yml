# GitHub Secrets → K8s Secret (단일 소스, 10/13 결정 2). bootstrap 이 매일 호출 + 값 바꿨을 때 수동 실행. 담당 구지훈
# 이름 · 키 · 생성 방법은 docs/secrets.md (값 없음). 값을 바꾸면: 노션 → GitHub Secret → 이 워크플로 → 해당 Deployment rollout restart
# 방식: kubectl create secret generic --dry-run=client -o yaml | kubectl apply -f -  (있으면 갱신, 없으면 생성 — 로그에 값 안 찍힘)
name: secrets-sync
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ROLE_ARN: { required: true }
      MYSQL_ROOT_PASSWORD: { required: true }
      USER_DB_PASSWORD: { required: true }
      STORE_DB_PASSWORD: { required: true }
      PRODUCT_DB_PASSWORD: { required: true }
      ORDER_DB_PASSWORD: { required: true }
      PAYMENT_DB_PASSWORD: { required: true }
      REVIEW_DB_PASSWORD: { required: true }
      SETTLEMENT_DB_PASSWORD: { required: true }
      KEYCLOAK_DB_PASSWORD: { required: true }
      KEYCLOAK_ADMIN_USERNAME: { required: true }
      KEYCLOAK_ADMIN_PASSWORD: { required: true }
      KEYCLOAK_CLIENT_SECRET: { required: true }
      PORTONE_API_SECRET: { required: true }
      PORTONE_WEBHOOK_SECRET: { required: true }
      GRAFANA_ADMIN_PASSWORD: { required: true }
      ALERT_WEBHOOK_URL: { required: true }

permissions:
  id-token: write
  contents: read

concurrency:
  group: secrets-sync   # 호출자(bootstrap)와 다른 그룹 (workflow_call 교착 방지)

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NS: sesac-gojigi
      MON_NS: monitoring
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
      - name: namespace 보장
        run: |
          kubectl get ns "$NS" >/dev/null 2>&1 || kubectl create ns "$NS"
          kubectl get ns "$MON_NS" >/dev/null 2>&1 || kubectl create ns "$MON_NS"

      # ── mysql-secret: root + 서비스 7개 + keycloak DB 비밀번호 (init-schemas.sh 가 ${SVC}_DB_PASSWORD 로 읽는다)
      - name: mysql-secret
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
          STORE_DB_PASSWORD: ${{ secrets.STORE_DB_PASSWORD }}
          PRODUCT_DB_PASSWORD: ${{ secrets.PRODUCT_DB_PASSWORD }}
          ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
          PAYMENT_DB_PASSWORD: ${{ secrets.PAYMENT_DB_PASSWORD }}
          REVIEW_DB_PASSWORD: ${{ secrets.REVIEW_DB_PASSWORD }}
          SETTLEMENT_DB_PASSWORD: ${{ secrets.SETTLEMENT_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
        run: |
          kubectl create secret generic mysql-secret -n "$NS" --dry-run=client -o yaml \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=USER_DB_PASSWORD="$USER_DB_PASSWORD" \
            --from-literal=STORE_DB_PASSWORD="$STORE_DB_PASSWORD" \
            --from-literal=PRODUCT_DB_PASSWORD="$PRODUCT_DB_PASSWORD" \
            --from-literal=ORDER_DB_PASSWORD="$ORDER_DB_PASSWORD" \
            --from-literal=PAYMENT_DB_PASSWORD="$PAYMENT_DB_PASSWORD" \
            --from-literal=REVIEW_DB_PASSWORD="$REVIEW_DB_PASSWORD" \
            --from-literal=SETTLEMENT_DB_PASSWORD="$SETTLEMENT_DB_PASSWORD" \
            --from-literal=KEYCLOAK_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD" \
            | kubectl apply -f -

      # ── {service}-secret: DB_USERNAME = 서비스명 (init-schemas.sh 의 계정) · DB_PASSWORD = <SVC>_DB_PASSWORD
      - name: service secrets (DB_USERNAME · DB_PASSWORD)
        env:
          USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
          STORE_DB_PASSWORD: ${{ secrets.STORE_DB_PASSWORD }}
          PRODUCT_DB_PASSWORD: ${{ secrets.PRODUCT_DB_PASSWORD }}
          ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
          PAYMENT_DB_PASSWORD: ${{ secrets.PAYMENT_DB_PASSWORD }}
          REVIEW_DB_PASSWORD: ${{ secrets.REVIEW_DB_PASSWORD }}
          SETTLEMENT_DB_PASSWORD: ${{ secrets.SETTLEMENT_DB_PASSWORD }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          PORTONE_WEBHOOK_SECRET: ${{ secrets.PORTONE_WEBHOOK_SECRET }}
        run: |
          for svc in user store product order payment review settlement; do
            pw_var="$(echo "$svc" | tr a-z A-Z)_DB_PASSWORD"
            extra=()
            case "$svc" in
              user)    extra=(--from-literal=KEYCLOAK_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET") ;;
              payment) extra=(--from-literal=PORTONE_API_SECRET="$PORTONE_API_SECRET" --from-literal=PORTONE_WEBHOOK_SECRET="$PORTONE_WEBHOOK_SECRET") ;;
            esac
            kubectl create secret generic "${svc}-service-secret" -n "$NS" --dry-run=client -o yaml \
              --from-literal=DB_USERNAME="$svc" \
              --from-literal=DB_PASSWORD="${!pw_var}" \
              "${extra[@]}" \
              | kubectl apply -f -
          done

      # ── keycloak-secret: Keycloak 이 envFrom 으로 받는다. GOTGAN_BACKEND_CLIENT_SECRET 은 realm JSON 자리표시자 치환용
      - name: keycloak-secret
        env:
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: |
          kubectl create secret generic keycloak-secret -n "$NS" --dry-run=client -o yaml \
            --from-literal=KC_DB_USERNAME=keycloak \
            --from-literal=KC_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD" \
            --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USERNAME" \
            --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            --from-literal=GOTGAN_BACKEND_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
            | kubectl apply -f -

      # ── monitoring: grafana-secret(admin-password) · alert-webhook-secret(url)
      - name: grafana-secret · alert-webhook-secret
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          kubectl create secret generic grafana-secret -n "$MON_NS" --dry-run=client -o yaml \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            | kubectl apply -f -
          kubectl create secret generic alert-webhook-secret -n "$MON_NS" --dry-run=client -o yaml \
            --from-literal=url="$ALERT_WEBHOOK_URL" \
            | kubectl apply -f -

      - name: 결과 (이름만)
        run: |
          kubectl get secret -n "$NS" -o name
          kubectl get secret -n "$MON_NS" -o name
