{{- range $name, $svc := .Values.services }}
---
# 무중단 배포 · 자동 복구 설정의 근거: 가이드라인 15장 7절 · 13장 복원력 시연
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default $.Values.defaults.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                     # 새 파드가 Ready 되기 전에는 기존 파드를 내리지 않음
      maxSurge: 1                           # 한 번에 1개씩만 추가 (노드 메모리 여유 고려)
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        tier: backend                       # NetworkPolicy(deploy/k8s/02-networkpolicy.yaml) — 이 라벨이 있어야 MySQL 3306 · Redis 6379 에 닿는다
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ $svc.port }}"
    spec:
      nodeSelector:
        tier: app                           # 백 티어 노드 그룹(app, t3.xlarge ×2) 에만. db 노드는 테인트 tier=db:NoSchedule 로 막혀 있음
      terminationGracePeriodSeconds: {{ $.Values.defaults.terminationGracePeriodSeconds }}
      {{- if gt (int ($svc.replicas | default $.Values.defaults.replicas)) 1 }}
      topologySpreadConstraints:            # 레플리카를 노드별로 나눈다 — 노드 하나가 죽어도 끊기지 않게. 자리가 없으면 그래도 띄운다(ScheduleAnyway)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]   # 배포 중에는 새 버전 파드끼리 나눈다
          labelSelector:
            matchLabels:
              app: {{ $name }}
      {{- end }}
      {{- if $svc.serviceAccount }}
      serviceAccountName: {{ $name }}
      {{- else }}
      automountServiceAccountToken: false   # IRSA 없는 서비스(gateway · payment · chat)는 쿠버네티스 API 토큰이 필요 없다 (Sonar S6865)
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $svc.repository }}:{{ $svc.tag }}"
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- toYaml (default $.Values.defaults.env $svc.env) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: app-config
            {{- if $svc.secretName }}
            - secretRef:
                name: {{ $svc.secretName }}
            {{- end }}
          resources:
            {{- include "app.resources" (dict "root" $ "svc" $svc) | nindent 12 }}
          startupProbe:                     # JVM 기동 대기 — 최대 5s × 36 = 3분
            httpGet: { path: /actuator/health/liveness, port: {{ $svc.port }} }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:                   # Ready 전에는 Service 가 트래픽을 보내지 않음
            httpGet: { path: /actuator/health/readiness, port: {{ $svc.port }} }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                    # 멈춘 JVM 은 재시작 (자동 복구)
            httpGet: { path: /actuator/health/liveness, port: {{ $svc.port }} }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:                        # 엔드포인트 제거가 kube-proxy · NLB 에 퍼질 시간
              exec: { command: ["sh", "-c", "sleep 10"] }
{{- end }}
