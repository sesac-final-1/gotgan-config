{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
  {{- if and $svc.service $svc.service.annotations }}
  annotations:
    {{- toYaml $svc.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if $svc.service }}{{ $svc.service.type | default "ClusterIP" }}{{ else }}ClusterIP{{ end }}   # 업무 서비스는 ClusterIP — 게이트웨이를 거치지 않으면 닿지 않는다
  selector:
    app: {{ $name }}
  ports:
    {{- /* port = Service(외부 NLB) 포트 — service.port 가 있으면 그 값(gateway 80), 없으면 앱 포트. targetPort = 파드(앱) 포트 */}}
    - port: {{ if and $svc.service $svc.service.port }}{{ $svc.service.port }}{{ else }}{{ $svc.port }}{{ end }}
      targetPort: {{ $svc.port }}
{{- end }}
