{{- range $name, $svc := .Values.services }}
{{- if $svc.serviceAccount }}
---
# IRSA — 서비스별 최소 권한 (가이드라인 04장)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $svc.serviceAccount.roleArn }}
{{- end }}
{{- end }}
