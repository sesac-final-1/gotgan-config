# 서비스별 항목 — CI(backend.yml) 는 자기 서비스의 tag 줄만 바꾼다. 공유 파일: 도메인별 구획 안에서만 수정 (컨벤션 1-4)
namespace: sesac-gojigi

image:
  registry: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com   # TODO 구지훈: Terraform ecr/ output

defaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 768Mi }
  terminationGracePeriodSeconds: 60

services:
  # ── gateway (perish95)
  gateway-service:
    repository: sesac-gojigi-gateway
    tag: "0000000"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8080
    replicas: 2                             # 입구는 2개 — 하나가 죽어도 접속 유지
    service:
      type: LoadBalancer
      annotations:                          # TODO 구지훈: NLB · EIP 할당 ID · 퍼블릭 서브넷 (가이드라인 05장)
        service.beta.kubernetes.io/aws-load-balancer-type: external
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  # ── user (perish95)
  user-service:
    repository: sesac-gojigi-user
    tag: "0000000"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8081
    secretName: user-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::<ACCOUNT_ID>:role/sesac-gojigi-user-irsa   # TODO 구지훈: Terraform cluster/irsa.tf (이름 고정 → ARN 불변)
  # ── store (VoC-100)
  store-service:
    repository: sesac-gojigi-store
    tag: "0000000"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8082
    secretName: store-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::<ACCOUNT_ID>:role/sesac-gojigi-store-irsa   # TODO 구지훈: Terraform cluster/irsa.tf (이름 고정 → ARN 불변)
  # ── product (VoC-100)
  product-service:
