# 서비스별 항목 — CI(backend.yml) 는 자기 서비스의 tag 줄만 바꾼다. 공유 파일: 도메인별 구획 안에서만 수정 (컨벤션 1-4)
# 모든 Deployment 는 templates/deployment.yaml 이 nodeSelector tier=app(백 티어 노드 그룹) + 파드 라벨 tier=backend(NetworkPolicy — DB 접근 허용 기준) 를 붙인다 (10/13 3차). 서비스별로 바꾸지 않는다
namespace: sesac-gojigi

image:
  registry: 694951014380.dkr.ecr.ap-northeast-2.amazonaws.com   # Terraform ecr/ output registry_id (구지훈)

defaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 768Mi }
  terminationGracePeriodSeconds: 60

services:
  # ── gateway (perish95)
  gateway-service:
    repository: sesac-gojigi-gateway
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8080
    replicas: 2                             # 입구는 2개 — 하나가 죽어도 접속 유지
    service:
      type: LoadBalancer
      port: 443                             # NLB 리스너 443(TLS 종료) → 파드 8080 — vercel.json 이 https://api.gotgan.click 로 호출. NLB 는 HTTP→HTTPS 리다이렉트 불가라 80 은 열지 않음
      annotations:                          # NLB · EIP · 퍼블릭 서브넷 (가이드라인 05장, 구지훈 — 10/14 실클러스터 검증)
        service.beta.kubernetes.io/aws-load-balancer-type: external
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-023c11797072725df,subnet-0d52b05d6f680839c          # vpc output public_subnets [2a, 2c]
        service.beta.kubernetes.io/aws-load-balancer-eip-allocations: eipalloc-00eaad35e9b548733,eipalloc-026aa7de15c62370c  # app output nlb_eip_allocation_ids — 서브넷과 같은 AZ 순서
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true                     # 없으면 파드 없는 AZ 의 EIP 무응답
        service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:ap-northeast-2:694951014380:certificate/b3d463f9-b838-4e95-b9f5-403d0da2e6a9   # app output api_certificate_arn (api.gotgan.click, ACM 자동 갱신)
        service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"                                                      # 443 리스너를 TLS 로
  # ── user (perish95)
  user-service:
    repository: sesac-gojigi-user
    tag: "a0423a6"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8081
    secretName: user-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-user-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── store (VoC-100)
  store-service:
    repository: sesac-gojigi-store
    tag: "07eef5d"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8082
    secretName: store-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-store-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── product (VoC-100)
  product-service:
    repository: sesac-gojigi-product
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8083
    secretName: product-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-product-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── order (perish95)
  order-service:
    repository: sesac-gojigi-order
    tag: "7153e48"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8084
    secretName: order-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-order-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── settlement (jihoon-devstu)
  settlement-service:
    repository: sesac-gojigi-settlement
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8085
    secretName: settlement-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-settlement-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── payment (jihoon-devstu)
  payment-service:
    repository: sesac-gojigi-payment
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8086
    replicas: 2                             # 결제 경로 — 파드 하나가 죽거나 재시작해도 결제 확인 · 웹훅 · 취소가 끊기지 않게 (10/21 장애 대비 12번). 취소 복구 스케줄러는 ShedLock 이라 한 파드만
    secretName: payment-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
  # ── review (perish95)
  review-service:
    repository: sesac-gojigi-review
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8087
    secretName: review-service-secret        # secrets-sync 워크플로가 만든 Secret → envFrom
    serviceAccount:
      roleArn: arn:aws:iam::694951014380:role/sesac-gojigi-review-irsa   # Terraform cluster/irsa.tf (이름 고정 → ARN 불변, 구지훈)
  # ── admin (jihoon-devstu)
  admin-service:
    repository: sesac-gojigi-admin
    tag: "201dec0"                          # ← GitHub Actions 가 커밋 SHA 7자리로 바꾸는 줄 (latest 금지)
    port: 8088
