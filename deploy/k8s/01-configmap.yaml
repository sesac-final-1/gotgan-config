# 모든 서비스가 같은 ConfigMap 을 환경 변수로 받는다 (가이드라인 15장 7절). 바꾼 뒤 rollout restart.
# 공유 파일 — 도메인별 구획 안에서만 수정 (컨벤션 1-4)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sesac-gojigi
data:
  SPRING_PROFILES_ACTIVE: k8s
  TZ: Asia/Seoul                                         # JVM 시간대 — DB · JDBC 와 함께 세 곳 모두 Asia/Seoul
  DB_HOST: mysql.sesac-gojigi.svc.cluster.local
  REDIS_HOST: redis.sesac-gojigi.svc.cluster.local
  KEYCLOAK_URI: http://keycloak:8080                    # 서버 간 호출(토큰 · Admin API · gateway 의 JWKS) — 내부 주소
  # ── 소셜 로그인 (이경석) — Keycloak 공개 주소 = KC_HOSTNAME (deploy/k8s/keycloak/keycloak.yaml)
  KEYCLOAK_ISSUER: https://api.gotgan.click/realms/gotgan                         # gateway 가 검증하는 토큰 iss
  KEYCLOAK_PUBLIC_URL: https://api.gotgan.click                                   # user-service — 브라우저를 보낼 Keycloak 로그인 주소
  SOCIAL_CALLBACK_URL: https://gotgan-ashy.vercel.app/api/auth/social/callback    # Keycloak → 우리 콜백 (realm redirectUris 와 같게, vercel 리라이트로 쿠키가 프론트 도메인에)
  SOCIAL_RESULT_URL: https://gotgan-ashy.vercel.app/auth/callback                 # 로그인 후 프론트 페이지
  # ── 서비스 주소 (CoreDNS 이름 — 게이트웨이 라우트 · 서비스 간 호출)
  USER_SERVICE_URI: http://user-service:8081
  STORE_SERVICE_URI: http://store-service:8082
  PRODUCT_SERVICE_URI: http://product-service:8083
  ORDER_SERVICE_URI: http://order-service:8084
  SETTLEMENT_SERVICE_URI: http://settlement-service:8085
  PAYMENT_SERVICE_URI: http://payment-service:8086
  REVIEW_SERVICE_URI: http://review-service:8087
  ADMIN_SERVICE_URI: http://admin-service:8088
  # ── 관측성
  LOKI_URL: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  ZIPKIN_ENDPOINT: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
  # ── order (데모용 단축, 가이드라인 10장)
  AUTO_CONFIRM_AFTER: 2m
  PAYMENT_TIMEOUT: 15m
  AUTO_DELIVER_AFTER: 1m                                 # 발송 후 자동 배송완료 (DLV-04, 운영 기본 1h — backend #99)
  # ── AWS 자원 (구지훈 — Terraform app/ output, 비밀 아님). 권한은 서비스별 IRSA(cluster/irsa.tf) 가 준다
  AWS_REGION: ap-northeast-2
  # SNS 토픽 — 발행: store · order · settlement 서비스 (app output topic_arns)
  STORE_EVENTS_TOPIC_ARN: arn:aws:sns:ap-northeast-2:694951014380:sesac-gojigi-store-events
  ORDER_EVENTS_TOPIC_ARN: arn:aws:sns:ap-northeast-2:694951014380:sesac-gojigi-order-events
  SETTLEMENT_EVENTS_TOPIC_ARN: arn:aws:sns:ap-northeast-2:694951014380:sesac-gojigi-settlement-events
  # SQS 구독 큐 URL — {소비자}_{도메인}_EVENTS_QUEUE_URL, 소비 서비스가 자기 것만 읽는다 (app output queue_urls)
  USER_STORE_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-user-store-events
  USER_ORDER_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-user-order-events
  PRODUCT_STORE_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-product-store-events
  REVIEW_ORDER_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-review-order-events
  SETTLEMENT_STORE_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-settlement-store-events
  SETTLEMENT_ORDER_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-settlement-order-events
  ADMIN_STORE_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-admin-store-events        # 알림 센터 (10/27)
  ADMIN_ORDER_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-admin-order-events
  ADMIN_SETTLEMENT_EVENTS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/694951014380/sesac-gojigi-admin-settlement-events
  INBOX_TABLE: sesac-gojigi-inbox                                                                                              # 알림 센터 알림함 (DynamoDB)
  # S3 버킷 — presigned PUT/GET 대상 (app output bucket_names). 이미지 조회 URL = IMAGES_BASE_URL/{products|reviews}/{key}
  IMAGES_BUCKET: sesac-gojigi-images-4380
  IMAGES_BASE_URL: https://sesac-gojigi-images-4380.s3.ap-northeast-2.amazonaws.com
  SELLER_DOCS_BUCKET: sesac-gojigi-seller-docs-4380
  REPORTS_BUCKET: sesac-gojigi-reports-4380
