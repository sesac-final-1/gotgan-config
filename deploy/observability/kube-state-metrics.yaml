# kube-state-metrics v2.19.1 — 쿠버네티스 오브젝트 상태(원하는/가용 레플리카 · 파드 Ready · 재시작 수)를 Prometheus 지표로 바꾼다. 담당 박지연 · 가이드라인 13장
# - System Status 대시보드의 데이터 원천 (blackbox exporter 없음 — 10/13 3차). 저장은 하지 않으므로 PVC 없음
# - 버전: EKS 1.35 에 맞춰 빌드된 v2.19.x (공식 호환표). EKS 버전을 업그레이드하면 이 이미지도 호환표에 맞춰 올릴 것
# - 수집 범위: System Status · 클러스터 대시보드에 쓰는 5종만 (--resources). 권한도 이 5종 읽기로 한정 — Secret 등은 보지 않는다
# - metrics-server(kubectl top 용 현재 CPU · 메모리) 와는 다른 도구. 둘 다 필요
#
# 구성 (위에서부터):
#   1. ServiceAccount     — 이 파드의 신분
#   2. ClusterRole        — 5종 오브젝트 읽기 권한 (list · watch)
#   3. ClusterRoleBinding — 1 에 2 를 부여
#   4. Deployment         — kube-state-metrics 컨테이너 1개 (app 노드, Prometheus 수집 어노테이션)
#   5. Service            — 고정 주소 kube-state-metrics.monitoring.svc:8080
#
# 1. ServiceAccount — 파드가 API 서버에 물어볼 때 쓰는 신분
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: gotgan-observability
---
# 2. ClusterRole — 읽기 권한표. 모든 네임스페이스의 오브젝트를 읽어야 하므로 Role 이 아닌 ClusterRole. 쓰기 권한 없음
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: gotgan-observability
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
---
# 3. ClusterRoleBinding — 1 의 ServiceAccount 에 2 의 권한을 부여
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: gotgan-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
# 4. Deployment — 실제 컨테이너.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: gotgan-observability
spec:
  replicas: 1                         # 2개면 같은 지표가 중복 수집된다. 죽으면 쿠버네티스가 다시 띄움 (그동안 그래프만 잠깐 빔)
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
        app.kubernetes.io/part-of: gotgan-observability
      annotations:                    # 업무 서비스(Helm deployment.yaml) 와 같은 방식 — Prometheus 가 이 어노테이션을 보고 수집 대상을 찾는다
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        tier: app                     # 백 티어 노드 그룹(app) 에만. db 노드는 테인트로 막혀 있음
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          args:
            - --resources=deployments,replicasets,statefulsets,pods,nodes
          ports:
            - { name: http-metrics, containerPort: 8080 }   # 클러스터 오브젝트 지표 (/metrics)
            - { name: telemetry, containerPort: 8081 }      # kube-state-metrics 자기 자신의 지표 · readiness
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }   # 노드 3대 · 파드 약 35개 규모. 공식 권장(250Mi)은 대규모 기준
          livenessProbe:
            httpGet: { path: /livez, port: http-metrics }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: telemetry }
            initialDelaySeconds: 5
          securityContext:            # 공식 매니페스트와 같은 최소 권한 실행
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
# 5. Service — 고정 주소 kube-state-metrics.monitoring.svc:8080. 수집은 4 의 어노테이션으로 하고, 이 주소는 대시보드 작업 중 port-forward 로 지표를 직접 확인할 때 쓴다
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
    app.kubernetes.io/part-of: gotgan-observability
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
    - { name: http-metrics, port: 8080, targetPort: http-metrics }
    - { name: telemetry, port: 8081, targetPort: telemetry }
