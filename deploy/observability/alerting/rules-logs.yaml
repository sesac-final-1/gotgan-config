# Grafana 알림 규칙 (담당 박지연) — 로그 기반(Loki). 지표로 알 수 없는 상황만 둔다. 지표 기반은 rules.yaml
# 찾는 문구를 코드에서 바꾸면 여기도 같이 고친다. 값을 바꾸면 다음 08:00 bootstrap 때 반영
apiVersion: 1
groups:
  - orgId: 1
    name: gotgan-logs
    folder: 곳간 알림
    interval: 1m     # Loki 메모리가 작아 지표 규칙(30초)보다 덜 자주 조회한다
    rules:
      - uid: outbox-attempts-exceeded
        title: "이벤트 발행 한도 초과"
        condition: C
        for: 0s      # 행마다 ERROR 한 번만 남으므로 바로 알린다
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: critical }
        annotations:
          summary: "{{ .Labels.app }} 이벤트 발행이 시도 한도에 닿아 자동 재발행이 멈췄습니다"
          description: "Logs 대시보드에서 수동 확인 필요 로그의 eventId 를 찾고, 원인을 고친 뒤 attempt_count 를 0 으로 되돌립니다."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum by (app) (count_over_time({namespace="sesac-gojigi", level="ERROR"} |= "이벤트 발행이" |= "수동 확인 필요" [5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
      - uid: rate-limiter-error
        title: "요청 제한 오류"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "gateway 가 요청 제한을 확인하지 못해 요청을 제한 없이 통과시키고 있습니다"
          description: "Redis 파드와 연결을 확인하세요. 서비스는 동작하지만 로그인 시도 제한도 풀린 상태입니다."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({namespace="sesac-gojigi", app="gateway-service"} |= "Error calling rate limiter lua" [5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
      - uid: gateway-upstream-errors
        title: "Gateway 502/504 증가"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { severity: warning }
        annotations:
          summary: "gateway 가 {{ .Labels.route }} 라우트 서비스에 연결하지 못하거나 응답을 받지 못했습니다"
          description: "해당 서비스의 파드 상태와 응답 지연을 확인하세요. 5분에 6건 미만은 판단하지 않습니다."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum by (route) (count_over_time({namespace="sesac-gojigi", app="gateway-service", level="WARN"} |~ "업무 서비스 (연결 실패|응답 타임아웃)" | regexp "route=(?P<route>[^ ]+)" [5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [5] } }]
