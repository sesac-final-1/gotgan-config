# Grafana 13.2.4 — 화면. 데이터를 저장하지 않고 Prometheus(지표) · Loki(로그) · Zipkin(트레이스) 에 물어봐서 그린다. 담당 박지연 · 가이드라인 13장
# - 데이터소스는 이 파일(2번 ConfigMap) 로 켜질 때마다 자동 등록(프로비저닝) — 클러스터가 매일 지워져도 git 에서 다시 만들어진다
# - 로그 ↔ 트레이스 연결: Loki 로그 본문의 traceId → Zipkin 링크, Zipkin 구간 → 같은 traceId 의 Loki 로그
#   traceId 정규식은 backend logback-spring.xml 의 JSON 형식("traceId":"...") 에 맞춘 것 — 로그 형식을 바꾸면 여기도 함께
# - 디스크 없음(Deployment): 설정 · 대시보드는 모두 파일(git) 로 관리한다. 화면에서 손으로 만든 대시보드는 파드 재시작 때 사라지므로 JSON 으로 내보내 커밋할 것
# - 대시보드: dashboards/*.json → bootstrap 이 grafana-dashboards ConfigMap 으로 만든다(--from-file) → 2-1 provider 가 등록
# - 로그인: grafana-secret(admin-user · admin-password, secrets-sync 가 생성) 의 관리자 계정 하나. 익명 접근 · 가입 없음
# - 외부 미노출 — 접속은 kubectl -n monitoring port-forward svc/grafana 3000 → http://localhost:3000
# - 아직 없는 것: 알림(4주차, alerting/ 폴더) · CloudWatch 데이터소스(5주차, IRSA 필요)
#
# 구성 (위에서부터):
#   1. ServiceAccount — 이름 grafana. 지금은 권한 없음 — 5주차 CloudWatch IRSA(monitoring:grafana) 가 이 이름을 가리킨다
#   2. ConfigMap      — 데이터소스 3개 등록 파일 (Prometheus · Loki · Zipkin) + 서로 연결
#   2-1. ConfigMap    — 대시보드 provider (어느 폴더의 JSON 을 대시보드로 올릴지)
#   3. Deployment     — Grafana 컨테이너 1개
#   4. Service        — 고정 주소 grafana.monitoring.svc:3000 (port-forward 접속)
#
# 1. ServiceAccount — 5주차에 IRSA 어노테이션(eks.amazonaws.com/role-arn) 만 추가하면 CloudWatch 를 읽을 수 있게 미리 만들어 둔다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: gotgan-observability
---
# 2. ConfigMap — 데이터소스 프로비저닝 파일. 파드 안 /etc/grafana/provisioning/datasources/ 로 마운트된다
#    $$ 는 Grafana 가 환경 변수로 해석하지 않도록 $ 를 그대로 남기는 표기
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: gotgan-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus               # 대시보드 JSON 이 이 uid 로 데이터소스를 찾는다 — 바꾸지 말 것
        type: prometheus
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        jsonData:
          timeInterval: 15s           # Prometheus 수집 간격과 맞춤 (prometheus.yaml)

      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc:3100
        jsonData:
          derivedFields:              # 로그 본문에서 traceId 를 찾아 Zipkin 링크로 만든다
            - name: traceId
              matcherRegex: '"traceId"\s*:\s*"(\w+)"'
              url: "$${__value.raw}"
              datasourceUid: zipkin
              urlDisplayLabel: Zipkin 에서 보기

      - name: Zipkin
        uid: zipkin
        type: zipkin
        url: http://zipkin.monitoring.svc:9411
        jsonData:
          tracesToLogsV2:             # 트레이스 구간의 "Related logs" 버튼 → 같은 traceId 의 로그. 그 요청이 거친 모든 서비스의 로그가 시간순으로 나온다
            datasourceUid: loki
            spanStartTimeShift: -5m   # 구간 앞뒤 5분의 로그를 찾는다
            spanEndTimeShift: 5m
            customQuery: true         # Zipkin 구간에는 service.name 속성이 없어 태그 매핑(tags) 으로는 링크가 생기지 않는다 → traceId 로만 찾는다
            query: '{namespace="sesac-gojigi"} |= "$${__span.traceId}"'
---
# 2-1. ConfigMap — 대시보드 provider. 파드 안 /etc/grafana/provisioning/dashboards/ 로 마운트된다
#      대시보드 JSON 자체는 이 파일에 없다 — bootstrap 이 dashboards/ 폴더로 만드는 grafana-dashboards ConfigMap 이 /etc/grafana/dashboards 로 마운트된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: gotgan-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gotgan
        type: file
        disableDeletion: true         # 화면에서 지우지 못하게 — 원본은 git
        allowUiUpdates: true          # 화면에서 고쳐 볼 수는 있음. 저장해도 재시작 때 사라지므로 JSON 으로 내보내 커밋
        updateIntervalSeconds: 60     # ConfigMap 이 바뀌면 재시작 없이 1분 안에 반영
        options:
          path: /etc/grafana/dashboards
---
# 3. Deployment — 실제 컨테이너. 죽으면 쿠버네티스가 다시 띄운다 (설정은 파일에서 다시 읽으므로 잃는 것 없음)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: gotgan-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: gotgan-observability
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false   # 쿠버네티스 API 를 쓰지 않으므로 API 토큰을 넣지 않는다 (SonarCloud S6865). 5주차 IRSA 는 AWS 용 토큰을 별도 경로로 넣으므로 무관할 것 — IRSA 적용 때 확인
      nodeSelector:
        tier: app                     # 백 티어 노드 그룹(app) 에만. db 노드는 테인트로 막혀 있음
      securityContext:
        runAsNonRoot: true
        runAsUser: 472                # 이미지 기본 사용자 grafana
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-secret, key: admin-user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-secret, key: admin-password }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }   # Grafana Labs 로 사용 통계를 보내지 않음
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi }   # 메모리: 첫 기동(내부 DB 생성 · 플러그인 내려받기) 때 약 250Mi(kind 실측)
            limits: { memory: 1Gi, ephemeral-storage: 512Mi }  # 메모리: 256Mi 에서는 첫 기동 중 OOMKilled → 받다 만 플러그인이 남아 서명 오류. 512Mi 에서는 EKS 조회 중 OOMKilled 2회(평소 약 220Mi, 6시간 up 조회에도 발생) → 1Gi. 임시 공간: 플러그인 · 내부 DB 약 53Mi(kind 실측) + 로그 최대 약 50Mi + 여유
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }   # Grafana 내부 DB(SQLite) · 세션 — 파드와 함께 사라지는 빈 폴더
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
            optional: true            # bootstrap 이 만들기 전 · 손으로 apply 할 때도 Grafana 는 뜨게 (대시보드만 없음)
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# 4. Service — 고정 주소 grafana.monitoring.svc:3000. 외부 미노출(ClusterIP) — 접속은 port-forward 로만 (가이드라인 12장 로그 접근 통제)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: gotgan-observability
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - { name: http, port: 3000, targetPort: http }
